        \ = {\n  'already_in_target': 'Уже в цілі — зміни не потрібні',\n  'battery_drives_load':\
        \ 'Батарея живить навантаження — підзарядка не потрібна',\n  'day_pv_low':\
        \ 'PV нижче споживання — берегти заряд',\n  'hysteresis_recovery': 'Відновлення\
        \ після паузи',\n  'night_window_usb': 'Нічна USB-стратегія',\n  'critical_recovery':\
        \ 'Критичний SOC — відновити заряд',\n  'surplus_enter_sbu': 'Надлишок PV\
        \ — перейти в SBU',\n  'reserve_soc_protection': 'SOC нижче резерву — захист',\n\
        \  'evening_reserve_protection': 'Вечірній резерв',\n  'emergency_low_soc_daytime':\
        \ 'Аварійно низький SOC удень',\n  'storm_mode': 'Штормовий режим — берегти\
        \ заряд',\n  'predictive_assist_evening': 'Підготувати SOC до вечора',\n \
        \ 'no_hint': 'Планувальник ще не сформував рекомендацію',\n  'hems_auto_off':\
        \ 'HEMS авто-режим вимкнено',\n  'unknown_mode': 'Невідомий режим',\n  'invalid_telemetry':\
        \ 'Невалідні дані телеметрії',\n  'soc_unknown': 'SOC невідомий — планувальник\
