        \ 'Арбітраж вночі',\n  'arbitrage_day_sbu': 'Арбітраж удень (SBU)',\n  'arbitrage_day_usb':\
        \ 'Арбітраж удень (USB)',\n  'forecast_good_use_battery': 'Прогноз сприятливий\
        \ — використати батарею',\n  'circuit_breaker': 'Захисне блокування HEMS',\n\
        \  'reserve_floor': 'SOC на резервній межі',\n  'dwell_lock': 'Утримання поточного\
        \ режиму — мінімальний інтервал між змінами не минув',\n} -%}\n{%- macro fmt_pct(value)\
        \ -%}\n  {%- if value is none -%}Немає даних\n  {%- else -%}{{ '{:.0f}'.format((value\
        \ | float) * 100) }} %\n  {%- endif -%}\n{%- endmacro -%}\n{%- macro short_reason(value)\
        \ -%}\n  {%- if value is none -%}Немає даних\n  {%- elif value in REASON_LABELS\
        \ -%}{{ REASON_LABELS[value] }}\n  {%- else -%}\n    {%- set raw = (value\
        \ | string) -%}\n    {%- set stripped = raw | regex_replace('^\\\\[ML\\\\\
