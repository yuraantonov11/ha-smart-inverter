title: Smart Solar Енергопанель
views:
- title: Огляд
  path: powmr-overview
  type: sections
  max_columns: 3
  dense_section_placement: false
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Потік енергії
      heading_style: title
    - type: custom:k-flow-card
      inverter_name: Інвертор
      sun: sun.sun
      pv_total_power: sensor.smart_solar_inverter_pv_power
      consump: sensor.smart_solar_inverter_load_power
      grid_active_power: sensor.smart_solar_inverter_grid_power
      battery_soc: sensor.smart_solar_inverter_battery_soc_corrected
      battery_voltage: sensor.smart_solar_inverter_battery_voltage
      battery_current: sensor.smart_solar_inverter_battery_current
      battery_power: sensor.smart_solar_inverter_battery_power
      compact: true
      grid_options:
        columns: full
        rows: auto
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Показники інвертора
      heading_style: title
    - type: entities
      title: Показники інвертора · хмара
      show_header_toggle: false
      entities:
      - entity: sensor.smart_solar_inverter_pv_power
        name: Сонце · хмара
      - entity: sensor.smart_solar_inverter_load_power
        name: Будинок · хмара
      - entity: sensor.smart_solar_inverter_battery_soc
        name: SOC за інвертором · хмара
      - entity: binary_sensor.smart_solar_inverter_grid_available
        name: Мережа · хмара
    - type: markdown
      content: '{% set reported = states(''sensor.smart_solar_inverter_battery_soc'')
        | float(none) %}

        {% set control = states(''sensor.smart_solar_inverter_battery_soc_corrected'')
        | float(none) %}

        {% if reported is not none and control is not none and reported != control
        %}

        **SOC різниться:** інвертор {{ reported | round(1) }}%, керування використовує
        {{ control | round(1) }}%.

        {% elif control is not none %}

        SOC керування: {{ control | round(1) }}%.

        {% else %}

        Ще немає показника SOC керування.

        {% endif %}'
  - type: grid
    cards:
    - type: heading
      heading: Автоматика зараз
      heading_style: title
    - type: markdown
      content: '{% set mode = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''mode'') %}

        **Прогнозна допомога:** {{ {''Off'':''Вимкнено'', ''off'':''Вимкнено'', ''Shadow'':''Спостереження'',
        ''shadow'':''Спостереження'', ''Assist'':''Допомога'', ''assist'':''Допомога''}.get(mode,
        ''Очікуємо дані'') }}.


        {% set applied = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''applied'') %}

        {% if applied is sameas true %}Рекомендацію прийнято HEMS.{% elif applied
        is sameas false %}Рекомендацію не застосовано.{% else %}Стан застосування
        ще не отримано.{% endif %}


        {% set reason = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''execution_reason'') %}

        {{ {''battery_drives_load'':''Батарея живить будинок — підзарядка не потрібна.'',
        ''already_in_target'':''Поточний заряд відповідає цілі.'', ''evening_reserve_protection'':''Зберігаємо
        вечірній резерв.'', ''forecast_good_use_battery'':''За прогнозом можна використовувати
        батарею.''}.get(reason, ''Причина та історія рішення — у подробицях автоматики.'')
        }}


        Поточні параметри не є підтвердженням виконання команди інвертором.'
    - type: button
      name: Автоматика →
      icon: mdi:robot
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /powmr-energy/powmr-automation
  - type: grid
    cards:
    - type: heading
      heading: Сьогодні та завтра
      heading_style: title
    - type: entities
      title: Підсумки
      show_header_toggle: false
      entities:
      - entity: sensor.smart_solar_inverter_daily_savings
        name: Валова оцінка сьогодні
      - entity: sensor.smart_solar_inverter_forecast_tomorrow
        name: Сонце завтра · прогноз
    - type: button
      name: Аналітика →
      icon: mdi:chart-line
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /powmr-energy/powmr-analytics
- title: Аналітика
  path: powmr-analytics
  type: sections
  max_columns: 3
  dense_section_placement: false
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Енергія
      heading_style: title
  - type: grid
    cards:
    - type: heading
      heading: Вартість
      heading_style: title
    - type: entities
      title: Валова оцінка
      show_header_toggle: false
      entities:
      - entity: sensor.smart_solar_inverter_daily_savings
        name: Сьогодні
      - entity: sensor.smart_solar_inverter_monthly_savings
        name: За місяць
    - type: markdown
      content: Оцінка вартості енергії розряду батареї. Витрати заряджання та втрати
        не відняті.
  - type: grid
    cards:
    - type: heading
      heading: Графіки та періоди
      heading_style: title
    - type: button
      name: Потужність, SOC та історія
      icon: mdi:chart-timeline-variant
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /powmr-energy/powmr-power
- title: Автоматика
  path: powmr-automation
  type: sections
  max_columns: 3
  dense_section_placement: false
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Рішення та стан
      heading_style: title
    - type: markdown
      content: '{% set mode = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''mode'') %}

        **Прогнозна допомога:** {{ {''Off'':''Вимкнено'', ''off'':''Вимкнено'', ''Shadow'':''Спостереження'',
        ''shadow'':''Спостереження'', ''Assist'':''Допомога'', ''assist'':''Допомога''}.get(mode,
        ''Очікуємо дані'') }}.


        {% set applied = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''applied'') %}

        {% if applied is sameas true %}Рекомендацію прийнято HEMS.{% elif applied
        is sameas false %}Рекомендацію не застосовано.{% else %}Стан застосування
        ще не отримано.{% endif %}


        {% set reason = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''execution_reason'') %}

        {{ {''battery_drives_load'':''Батарея живить будинок — підзарядка не потрібна.'',
        ''already_in_target'':''Поточний заряд відповідає цілі.'', ''evening_reserve_protection'':''Зберігаємо
        вечірній резерв.'', ''forecast_good_use_battery'':''За прогнозом можна використовувати
        батарею.''}.get(reason, ''Причина та історія рішення — у подробицях автоматики.'')
        }}


        Поточні параметри не є підтвердженням виконання команди інвертором.'
  - type: grid
    cards:
    - type: heading
      heading: Готовність прогнозного керування
      heading_style: title
    - type: markdown
      content: '{% set ready = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''readiness'') %}

        {% set limits = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''battery_limits_known'') %}

        {% if ready is sameas true %}

        **Прогнозне керування готове.**

        {% elif limits is sameas false %}

        **Потрібні обмеження батареї.** Підтвердьте допустимі потужності заряджання
        й розряду в налаштуваннях.

        {% elif ready is sameas false %}

        **Поки що лише прогноз.** Очікуємо достатньої якості даних та завершених пар
        прогноз–факт.

        {% else %}

        Очікуємо стану готовності прогнозного керування.

        {% endif %}'
    - type: button
      name: Налаштування батареї
      icon: mdi:battery-cog
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/powmr_inverter
  - type: grid
    cards:
    - type: heading
      heading: Режим
      heading_style: title
    - type: entities
      title: Автоматичне керування
      show_header_toggle: false
      entities:
      - entity: switch.smart_solar_inverter_hems_auto_mode
        name: Автоматичне керування
      - entity: select.smart_solar_inverter_smart_mode
        name: Стратегія
  - type: grid
    cards:
    - type: heading
      heading: Ручне керування
      heading_style: title
    - type: custom:smart-solar-controls-card
      title: Пріоритети та ліміти
      entities:
      - entity: select.smart_solar_inverter_output_priority
        name: Живлення будинку
      - entity: select.smart_solar_inverter_charger_priority
        name: Джерело заряду
      - entity: number.smart_solar_inverter_max_charging_current
        name: Загальний струм заряду, А
      - entity: number.smart_solar_inverter_max_utility_charging_current
        name: Струм заряду від мережі, А
      - entity: switch.smart_solar_inverter_grid_feed_in
        name: Віддача в мережу
  - type: grid
    cards:
    - type: heading
      heading: Дії та подробиці
      heading_style: title
    - type: button
      name: Прогнози та їхня якість
      icon: mdi:weather-partly-cloudy
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /powmr-energy/powmr-forecasts
  - type: grid
    cards:
    - type: heading
      heading: Прогноз
      heading_style: title
    - type: entities
      title: Сонячна генерація
      show_header_toggle: false
      entities:
      - entity: sensor.smart_solar_inverter_forecast_tomorrow
        name: Завтра
- title: Система
  path: powmr-system
  type: sections
  max_columns: 3
  dense_section_placement: false
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Підключення
      heading_style: title
    - type: markdown
      content: '**Керування:** хмарні дані. Bluetooth використовується для перегляду.'
  - type: grid
    cards:
    - type: heading
      heading: Налаштування
      heading_style: title
    - type: button
      name: Параметри інтеграції
      icon: mdi:cog
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/powmr_inverter
  - type: grid
    cards:
    - type: heading
      heading: Батарея та обладнання
      heading_style: title
    - type: entities
      title: Поточні виміри · хмара
      show_header_toggle: false
      entities:
      - entity: sensor.smart_solar_inverter_battery_voltage
        name: Напруга батареї
      - entity: sensor.smart_solar_inverter_battery_current
        name: Струм батареї
      - entity: sensor.smart_solar_inverter_grid_voltage
        name: Напруга мережі
  - type: grid
    cards:
    - type: heading
      heading: Діагностика та збережені сторінки
      heading_style: title
    - type: button
      name: Потужність
      icon: mdi:information-outline
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /powmr-energy/powmr-power
    - type: button
      name: HEMS
      icon: mdi:information-outline
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /powmr-energy/powmr-hems
- title: Прогнози
  path: powmr-forecasts
  type: sections
  max_columns: 3
  dense_section_placement: false
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Сонячна генерація
      heading_style: title
    - type: entities
      title: Оновлений прогноз
      show_header_toggle: false
      entities:
      - entity: sensor.smart_solar_inverter_forecast_tomorrow
        name: Завтра
    - type: markdown
      content: Прогноз, не фактична генерація. Дата та дані моделі — у властивостях
        показника.
  - type: grid
    cards:
    - type: heading
      heading: Споживання
      heading_style: title
    - type: markdown
      content: '{% set d = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''load_forecast'') or {} %}

        {% if d.get(''hourly_w'') %}

        **{{ d.target_date }}:** {{ ''%.2f'' | format((d.hourly_w | sum) / 1000) }}
        кВт·год.

        {% if d.get(''daily_error_range_kwh'') %}

        Діапазон за минулими помилками: {{ ''%.2f'' | format(d.daily_error_range_kwh[0])
        }}–{{ ''%.2f'' | format(d.daily_error_range_kwh[1]) }} кВт·год.

        {% endif %}

        {% else %}

        Ще немає достатньої історії завершених виміряних діб.

        {% endif %}

        {% set w = d.get(''validation_windows'', {}).get(''30'', {}) %}

        {% if w.get(''samples'', 0) > 0 %}

        Перевірка на історії: {{ w.samples }} діб, середня добова помилка {{ w.daily_mae_kwh
        }} кВт·год.

        {% endif %}


        Історична перевірка — окрема оцінка, не журнал раніше виданих прогнозів.'
  - type: grid
    cards:
    - type: heading
      heading: Якість сонячного прогнозу
      heading_style: title
    - type: markdown
      content: '{% set pairs = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''real_pairs'') | int(0) %}

        {% set c = state_attr(''sensor.smart_solar_inverter_predictive_decision_state'',
        ''forecast_calibration'') or {} %}

        {% if pairs == 0 %}

        **Точність поточної моделі ще не виміряна.** Очікуємо завершених порівнюваних
        діб.

        {% else %}

        Завершених пар поточної моделі: **{{ pairs }}**.

        {% endif %}

        {% for days in [''7'', ''30''] %}

        {% set w = c.get(''completed_windows'', {}).get(days, {}) %}

        {% if w.get(''samples'', 0) > 0 %}

        За {{ days }} днів: {{ w.samples }} діб; середня абсолютна помилка **{{ w.mae_kwh
        }} кВт·год/добу**.

        {% endif %}

        {% endfor %}


        Якість вимірюється за зафіксованими прогнозами та фактом після завершення
        доби. Внутрішня впевненість не є відсотком точності.'
  - type: grid
    cards:
    - type: heading
      heading: Погодинний прогноз і факт
      heading_style: title
    - type: custom:pv-comparison-card
      entity: sensor.smart_solar_inverter_pv_generation_curve
      forecast_entity: sensor.smart_solar_inverter_forecast_tomorrow
      title: Генерація та прогноз PV
    column_span: 2
  subview: true
  back_path: /powmr-energy/powmr-automation
- title: Потужність
  path: powmr-power
  icon: mdi:home-lightning-bolt
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: custom:k-flow-card
      inverter_name: Інвертор
      sun: sun.sun
      pv_total_power: sensor.smart_solar_inverter_pv_power
      consump: sensor.smart_solar_inverter_load_power
      grid_active_power: sensor.smart_solar_inverter_grid_power
      battery_soc: sensor.smart_solar_inverter_battery_soc_corrected
      battery_voltage: sensor.smart_solar_inverter_battery_voltage
      battery_current: sensor.smart_solar_inverter_battery_current
      battery_power: sensor.smart_solar_inverter_battery_power
  - type: grid
    cards:
    - type: markdown
      content: '# Smart Solar Inverter

        Живий потік потужності, стан мережі та батареї в одному місці.

        '
    - type: tile
      entity: binary_sensor.smart_solar_inverter_grid_available
      name: Стан мережі
      icon: mdi:transmission-tower
    - type: tile
      entity: sensor.smart_solar_inverter_working_mode
      name: Режим роботи
      icon: mdi:state-machine
    - type: tile
      entity: sensor.smart_solar_inverter_battery_soc_corrected
      name: Скоригований SOC
      icon: mdi:battery-heart-variant
    - type: tile
      entity: sensor.smart_solar_inverter_pv_surplus
      name: Надлишок PV
      icon: mdi:battery-heart-variant
    - type: tile
      entity: sensor.smart_solar_inverter_pv_surplus
      name: Надлишок PV
      icon: mdi:flash
    - type: tile
      entity: sensor.smart_solar_inverter_grid_voltage
      name: Напруга мережі
      icon: mdi:sine-wave
  - type: grid
    cards:
    - type: gauge
      entity: sensor.smart_solar_inverter_battery_soc_corrected
      name: SOC батареї
      min: 0
      max: 100
      severity:
        green: 45
        yellow: 25
        red: 0
    - type: gauge
      entity: sensor.smart_solar_inverter_pv_power
      name: Потужність PV
      min: 0
      max: 5000
      severity:
        green: 1200
        yellow: 400
        red: 0
    - type: gauge
      entity: sensor.smart_solar_inverter_load_power
      name: Потужність навантаження
      min: 0
      max: 5000
      severity:
        green: 0
        yellow: 2200
        red: 3600
    - type: statistics-graph
      title: Потік потужності (24г)
      chart_type: line
      period: hour
      days_to_show: 1
      stat_types:
      - mean
      entities:
      - sensor.smart_solar_inverter_pv_power
      - sensor.smart_solar_inverter_load_power
      - sensor.smart_solar_inverter_grid_power
      - sensor.smart_solar_inverter_battery_power
    - type: statistics-graph
      title: SOC та струм батареї (24г)
      hours_to_show: 24
      refresh_interval: 60
      entities:
      - sensor.smart_solar_inverter_battery_soc
      - sensor.smart_solar_inverter_battery_soc_corrected
      - sensor.smart_solar_inverter_battery_charge_current
    - type: custom:pv-comparison-card
      entity: sensor.smart_solar_inverter_pv_generation_curve
      forecast_entity: sensor.smart_solar_inverter_forecast_tomorrow
      title: Генерація та прогноз PV
  - type: grid
    cards:
    - type: entities
      title: Керування інвертором
      show_header_toggle: false
      entities:
      - entity: select.smart_solar_inverter_output_priority
        name: Пріоритет виходу
      - entity: select.smart_solar_inverter_charger_priority
        name: Пріоритет заряджання
      - entity: select.smart_solar_inverter_smart_mode
        name: Режим HEMS
      - entity: switch.smart_solar_inverter_hems_auto_mode
        name: Авто-режим HEMS
      - entity: switch.smart_solar_inverter_backup_mode
        name: Резервний режим
    - type: entities
      title: Струми та ліміти
      show_header_toggle: false
      entities:
      - entity: number.smart_solar_inverter_max_charging_current
        name: Макс. струм заряджання
      - entity: number.smart_solar_inverter_max_utility_charging_current
        name: Макс. струм заряду від мережі
      - entity: number.smart_solar_inverter_battery_charge_limit_percent
        name: Ліміт заряду АКБ
      - entity: number.smart_solar_inverter_battery_discharge_limit_percent
        name: Ліміт розряду АКБ
      - entity: number.smart_solar_inverter_grid_charge_power_limit
        name: Макс. потужність заряду (мережа)
    - type: entities
      title: Керування мережею
      show_header_toggle: false
      entities:
      - entity: switch.smart_solar_inverter_grid_charging
        name: Заряд від мережі
      - entity: switch.smart_solar_inverter_grid_feed_in
        name: Віддача в мережу
    - type: entities
      title: Поточний стан
      show_header_toggle: false
      entities:
      - entity: binary_sensor.smart_solar_inverter_grid_available
        name: Стан мережі
      - entity: sensor.smart_solar_inverter_pv_voltage
        name: Напруга PV
      - entity: sensor.smart_solar_inverter_grid_voltage
        name: Напруга мережі
      - entity: sensor.smart_solar_inverter_battery_voltage
        name: Напруга АКБ
      - entity: sensor.smart_solar_inverter_battery_current
        name: Струм батареї
      - entity: sensor.smart_solar_inverter_ac_output_power
        name: Вихідна потужність AC
      - entity: sensor.smart_solar_inverter_feed_in_power
        name: Віддача в мережу
      - entity: sensor.smart_solar_inverter_grid_import_power
        name: Споживання з мережі
    - type: entities
      title: 💰 Економіка
      show_header_toggle: false
      entities:
      - entity: sensor.smart_solar_inverter_daily_savings
        name: Валова оцінка вартості заміщеного імпорту · сьогодні (₴)
      - entity: sensor.smart_solar_inverter_monthly_savings
        name: Валова оцінка вартості заміщеного імпорту · місяць (₴)
      - entity: sensor.smart_solar_inverter_forecast_tomorrow
        name: Прогноз завтра (kWh)
      - entity: sensor.smart_solar_inverter_learned_ratio
        name: Коеф. конверсії PV
    - type: entities
      title: 'SOC: спостереження'
      show_header_toggle: false
      state_color: true
      entities:
      - entity: sensor.smart_solar_inverter_battery_soc
        name: Повідомлено пристроєм (raw)
