        \ elif has_manual_rec is sameas false %}Автоматично — ручну ціль не задано.\
        \ Натисни кнопку «Задати ручну ціль SOC», щоб тимчасово скоригувати рекомендацію.{%\
        \ elif has_manual_rec is none %}Контрол ще не завантажився — зачекай першого\
        \ циклу.{% else %}Ручна ціль: {{ states(SELECT) }} % · HEMS на паузі 30 хв.\
        \ Скинути ручну ціль — схвали поточну AI-рекомендацію або скасуй паузу.{%\
        \ endif %}\n\n**Діагностика машинного коду:**\n{%- if mode is not none %}`mode\
        \ = \"{{ mode }}\"`{% endif %}\n{%- if confidence is not none %}`confidence\
        \ = {{ confidence }}`{% endif %}\n{%- if applied is not none %}`applied =\
        \ {{ applied | string | lower }}`{% endif %}\n{%- if reason is not none %}`reason\
        \ = \"{{ reason }}\"`{% endif %}\n{%- if execution_reason is not none %}`execution_reason\
        \ = \"{{ execution_reason }}\"`{% endif %}\n{%- if samples is not none %}`samples\
        \ = {{ samples }}`{% endif %}\n{%- if pause_until is not none %}`override_pending_until\
        \ = \"{{ pause_until }}\"`{% endif %}\n{%- if target_soc_attr is not none\
        \ %}`select.target_soc = {{ target_soc_attr }}`{% else %}`select.target_soc\
        \ = null`{% endif %}\n\n_AI лише рекомендує; HEMS вирішує, чи застосувати.\
        \ «Застосовано» означає прийняття AI-рекомендації HEMS, а не фізичну дію інвертора._\n"
    - type: markdown
      title: AI · SOC-стан
      content: '{%- set SELECT = ''select.smart_solar_inverter_predictive_target_soc''
        -%}

        {%- set target_soc_attr = state_attr(SELECT, ''target_soc'') -%}

        {%- set has_manual = state_attr(SELECT, ''has_manual_target'') -%}

        {%- set raw_target = states(SELECT) -%}

        {%- set target_str = (raw_target | string | trim) -%}


        **Стан SOC-контролу:** {% if has_manual is true and target_soc_attr is number
        %}{{ target_soc_attr | int }} % · ручну ціль задано · HEMS на паузі 30 хв.{%
        elif has_manual is sameas false %}Автоматично — ручну ціль не задано. Планувальник
        сам обирає ціль. Обери 20–100 у more-info, щоб тимчасово скоригувати рекомендацію.{%
        elif has_manual is none %}Контрол ще не завантажився — зачекай першого циклу.{%
        else %}Ручна ціль: {{ target_str }} % · HEMS на паузі 30 хв.{% endif %}


        Обери значення 20–100 у more-info, щоб тимчасово скоригувати рекомендацію
        (HEMS на паузі 30 хв). Скинути ручну ціль — схвали поточну AI-рекомендацію
        або скасуй паузу.


        {%- if has_manual is true or target_soc_attr is number %}

        **Діагностика:** `target_soc = {{ target_soc_attr }}`, `has_manual_target
        = {{ (has_manual | default(false)) | string | lower }}`.

        {%- else %}

        **Діагностика:** `target_soc = null`, `has_manual_target = false`.

        {%- endif %}

        '
    - type: button
      name: Задати ручну ціль SOC
