title: Smart Solar Енергопанель
views:
  - title: Потужність
    path: powmr-power
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # Smart Solar Inverter
              Живий потік потужності, стан мережі та батареї в одному місці.
          - type: tile
            entity: binary_sensor.smart_solar_inverter_grid_available
            name: Стан мережі
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.smart_solar_inverter_working_mode
            name: Режим роботи
            icon: mdi:state-machine
          - type: tile
            entity: sensor.smart_solar_inverter_battery_soc_corrected
            name: Скоригований SOC
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.smart_solar_inverter_pv_surplus
            name: Надлишок PV
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.smart_solar_inverter_pv_surplus
            name: Надлишок PV
            icon: mdi:flash
          - type: tile
            entity: sensor.smart_solar_inverter_grid_voltage
            name: Напруга мережі
            icon: mdi:sine-wave
      - type: grid
        cards:
          - type: gauge
            entity: sensor.smart_solar_inverter_battery_soc_corrected
            name: SOC батареї
            min: 0
            max: 100
            severity:
              green: 45
              yellow: 25
              red: 0
          - type: gauge
            entity: sensor.smart_solar_inverter_pv_power
            name: Потужність PV
            min: 0
            max: 5000
            severity:
              green: 1200
              yellow: 400
              red: 0
          - type: gauge
            entity: sensor.smart_solar_inverter_load_power
            name: Потужність навантаження
            min: 0
            max: 5000
            severity:
              green: 0
              yellow: 2200
              red: 3600
          - type: statistics-graph
            title: Потік потужності (24г)
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - sensor.smart_solar_inverter_pv_power
              - sensor.smart_solar_inverter_load_power
              - sensor.smart_solar_inverter_grid_power
              - sensor.smart_solar_inverter_battery_power
          - type: statistics-graph
            title: SOC та струм батареї (24г)
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - sensor.smart_solar_inverter_battery_soc
              - sensor.smart_solar_inverter_battery_soc_corrected
              - sensor.smart_solar_inverter_battery_charge_current
          - type: custom:pv-comparison-card
            entity: sensor.smart_solar_inverter_pv_generation_curve
            forecast_entity: sensor.smart_solar_inverter_forecast_tomorrow
            title: Генерація та прогноз PV
      - type: grid
        cards:
          - type: entities
            title: Керування інвертором
            show_header_toggle: false
            entities:
              - entity: select.smart_solar_inverter_output_priority
                name: Пріоритет виходу
              - entity: select.smart_solar_inverter_charger_priority
                name: Пріоритет заряджання
              - entity: select.smart_solar_inverter_smart_mode
                name: Режим HEMS
              - entity: switch.smart_solar_inverter_hems_auto_mode
                name: Авто-режим HEMS
              - entity: switch.smart_solar_inverter_backup_mode
                name: Резервний режим
          - type: entities
            title: Струми та ліміти
            show_header_toggle: false
            entities:
              - entity: number.smart_solar_inverter_max_charging_current
                name: Макс. струм заряджання
              - entity: number.smart_solar_inverter_max_utility_charging_current
                name: Макс. струм заряду від мережі
              - entity: number.smart_solar_inverter_battery_charge_limit_percent
                name: Ліміт заряду АКБ
              - entity: number.smart_solar_inverter_battery_discharge_limit_percent
                name: Ліміт розряду АКБ
              - entity: number.smart_solar_inverter_grid_charge_power_limit
                name: Макс. потужність заряду (мережа)
          - type: entities
            title: Керування мережею
            show_header_toggle: false
            entities:
              - entity: switch.smart_solar_inverter_grid_charging
                name: Заряд від мережі
              - entity: switch.smart_solar_inverter_grid_feed_in
                name: Віддача в мережу
          - type: entities
            title: Поточний стан
            show_header_toggle: false
            entities:
              - entity: binary_sensor.smart_solar_inverter_grid_available
                name: Стан мережі
              - entity: sensor.smart_solar_inverter_pv_voltage
                name: Напруга PV
              - entity: sensor.smart_solar_inverter_grid_voltage
                name: Напруга мережі
              - entity: sensor.smart_solar_inverter_battery_voltage
                name: Напруга АКБ
              - entity: sensor.smart_solar_inverter_battery_current
                name: Струм батареї
              - entity: sensor.smart_solar_inverter_ac_output_power
                name: Вихідна потужність AC
              - entity: sensor.smart_solar_inverter_feed_in_power
                name: Віддача в мережу
              - entity: sensor.smart_solar_inverter_grid_import_power
                name: Споживання з мережі
          - type: entities
            title: 💰 Економіка
            show_header_toggle: false
            entities:
              - entity: sensor.smart_solar_inverter_daily_savings
                name: Валова оцінка вартості заміщеного імпорту · сьогодні (₴)
              - entity: sensor.smart_solar_inverter_monthly_savings
                name: Валова оцінка вартості заміщеного імпорту · місяць (₴)
              - entity: sensor.smart_solar_inverter_forecast_tomorrow
                name: Прогноз завтра (kWh)
              - entity: sensor.smart_solar_inverter_learned_ratio
                name: Коеф. конверсії PV
          - type: statistics-graph
            title: Валова оцінка вартості заміщеного імпорту · денна накопичена за 24 години
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - entity: sensor.smart_solar_inverter_daily_savings
                name: Денний накопичений показник (UAH)
          - type: markdown
            content: Погодинне середнє накопиченої оцінки економії за добу. Показник скидається опівночі та після перезапуску інтеграції.
          - type: entities
            title: Прогноз сонячної генерації
            show_header_toggle: false
            entities:
              - entity: sensor.smart_solar_inverter_pv_power
                name: PV потужність (зараз)
              - entity: sensor.smart_solar_inverter_battery_soc_corrected
                name: SOC батареї

  - title: HEMS
    path: powmr-hems
    icon: mdi:brain
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: entities
            title: AI · рекомендація та виконання
            show_header_toggle: false
            entities:
              - entity: sensor.smart_solar_inverter_predictive_decision_state
                name: Поточне рішення AI
              - entity: select.smart_solar_inverter_predictive_target_soc
                name: Скоригувати SOC · пауза на 30 хв
              - type: attribute
                entity: sensor.smart_solar_inverter_predictive_decision_state
                attribute: reason
                name: Причина рекомендації
              - type: attribute
                entity: sensor.smart_solar_inverter_predictive_decision_state
                attribute: execution_reason
                name: Причина виконання або блокування
              - type: attribute
                entity: sensor.smart_solar_inverter_predictive_decision_state
                attribute: confidence
                name: Впевненість
              - type: attribute
                entity: sensor.smart_solar_inverter_predictive_decision_state
                attribute: samples
                name: Реальні пари факт ↔ прогноз
              - type: attribute
                entity: sensor.smart_solar_inverter_predictive_decision_state
                attribute: applied
                name: Застосовано
          - type: markdown
            title: AI · SOC-стан
            content: |
              {%- set raw_target = states('select.smart_solar_inverter_predictive_target_soc') -%}
              {%- set target_str = (raw_target | string | trim) -%}
              {%- set target_is_empty = (target_str == '' or target_str == 'None' or target_str == 'unknown' or target_str == 'unavailable' or target_str == 'none') -%}
              {%- if target_is_empty -%}
                **Стан SOC-цілі:** Автоматично — ручну ціль не задано. Щоб тимчасово скоригувати рекомендацію, обери значення 20–100 у select вище — HEMS стане на паузу на 30 хв.
              {%- else -%}
                **Стан SOC-цілі:** Ручна ціль: {{ target_str }} % · HEMS на паузі 30 хв. Скинути ручну ціль — схвали поточну AI-рекомендацію або скасуй паузу.
              {%- endif -%}
          - type: markdown
            title: AI · навчання і точність
            content: |
              {%- set c = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'forecast_calibration') or {} -%}
              {%- set MODE_LABELS = {'Off': 'Вимкнено (Off)', 'Shadow': 'Спостереження (Shadow)', 'Assist': 'Підтримка (Assist)'} -%}
              {%- set APPLIED_LABELS = {true: 'Так (AI рекомендація прийнята HEMS)', false: 'Ні (AI рекомендація не прийнята)'} -%}
              {%- set REASON_LABELS = {
                'already_in_target': 'Поточна конфігурація вже відповідає цілі — зміни не потрібні (already_in_target)',
                'battery_drives_load': 'Батарея живить навантаження — AI не рекомендує підзарядку (battery_drives_load)',
                'day_pv_low': 'Прогнозована PV-потужність нижча за споживання — AI рекомендує берегти заряд (day_pv_low)',
                'hysteresis_recovery': 'Повернення до попереднього режиму після тимчасової паузи (hysteresis_recovery)',
                'night_window_usb': 'Нічна USB-стратегія: рекомендація мінімізувати цикли батареї (night_window_usb)',
                'critical_recovery': 'Критичний SOC — рекомендація: відновлення заряду (critical_recovery)',
                'surplus_enter_sbu': 'Надлишок PV — рекомендація: перехід у SBU для накопичення (surplus_enter_sbu)',
                'reserve_soc_protection': 'SOC нижче резерву — рекомендація: захист від глибокого розряду (reserve_soc_protection)',
                'evening_reserve_protection': 'Вечірній резерв — рекомендація: підготуватися до нічного споживання (evening_reserve_protection)',
                'emergency_low_soc_daytime': 'Аварійно низький SOC удень — рекомендація: термінове відновлення (emergency_low_soc_daytime)',
                'storm_mode': 'Штормовий режим — рекомендація: берегти заряд для автономії (storm_mode)',
                'predictive_assist_evening': 'Прогнозна підтримка — рекомендація: підвищити SOC до вечора (predictive_assist_evening)',
                'no_hint': 'Планувальник ще не сформував рекомендацію (no_hint)',
                'hems_auto_off': 'HEMS авто-режим вимкнено (hems_auto_off)',
                'unknown_mode': 'Невідомий режим — рекомендація: повернення до безпечного (unknown_mode)',
                'invalid_telemetry': 'Невалідні дані телеметрії — рішення відкладено (invalid_telemetry)',
                'soc_unknown': 'SOC невідомий — планувальник утримується (soc_unknown)',
                'day_default': 'Стандартна денна стратегія без додаткових сигналів (day_default)',
                'arbitrage_night': 'Арбітраж вночі — AI рекомендує: заряд від мережі за нічним тарифом (arbitrage_night)',
                'arbitrage_day_sbu': 'Арбітраж удень — AI рекомендує SBU для максимального самозабезпечення (arbitrage_day_sbu)',
                'arbitrage_day_usb': 'Арбітраж удень — AI рекомендує USB для уникнення розряду (arbitrage_day_usb)',
                'forecast_good_use_battery': 'Прогноз сприятливий — AI рекомендує використати батарею (forecast_good_use_battery)',
                'circuit_breaker': 'Захисне блокування HEMS (circuit_breaker)',
                'reserve_floor': 'SOC досяг резервної межі — рекомендація: заряджання обовʼязкове (reserve_floor)',
              } -%}
              {%- macro render_reason(value) -%}
                {%- if value is none -%}
                  Дані недоступні
                {%- elif value in REASON_LABELS -%}
                  {{ REASON_LABELS[value] }}
                {%- elif ':' in (value | string) -%}
                  {%- set parts = (value | string).split(':', 1) -%}
                  {%- set head = parts[0].strip() -%}
                  {%- set tail = parts[1].strip() -%}
                  {%- set ua = REASON_LABELS.get(head) -%}
                  {%- if ua -%}
                    {{ ua }} — деталі: {{ tail }}
                  {%- else -%}
                    Невідомий reason: {{ head }} — деталі: {{ tail }}
                  {%- endif -%}
                {%- else -%}
                  Невідомий reason: {{ value }}
                {%- endif -%}
              {%- endmacro -%}
              {%- set model_key = c.get('forecast_model') -%}
              {%- set MODEL_LABELS = {
                'hourly_response_v1': 'Погодинна модель станції (v1)',
                'station_gain_v1': 'Добова модель станції (v1)',
                'hourly_response_v2': 'Погодинна модель станції (v2)',
                'station_gain_v2': 'Добова модель станції (v2)',
              } -%}

              **Модель:** {{ MODEL_LABELS.get(model_key, 'ще не визначена (' ~ (model_key if model_key else 'невідомо') ~ ')') }}

              {%- if has_value('sensor.smart_solar_inverter_predictive_decision_state') %}
              {%- set pause_until = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'override_pending_until') %}
              **Пауза:** {{ ('Пауза активна до ' ~ pause_until) if pause_until else 'Пауза не активна' }}
              {%- else %}
              **Пауза:** Дані недоступні
              {%- endif %}

              {%- set mode = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'mode') %}
              {%- set confidence = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'confidence') %}
              {%- set applied = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'applied') %}
              {%- set reason = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'reason') %}
              {%- set execution_reason = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'execution_reason') %}

              **Режим AI:** {{ MODE_LABELS.get(mode, 'Невідомо (' ~ (mode if mode is not none else '—') ~ ')') }}
              {%- if confidence is not none %}
              **Впевненість:** {{ ('%.0f'|format((confidence | float) * 100)) }} %
              {%- else %}
              **Впевненість:** Дані недоступні
              {%- endif %}
              **Застосовано:** {{ APPLIED_LABELS.get(applied, 'Дані недоступні') }}

              **Причина рекомендації:** {{ render_reason(reason) }}
              **Причина виконання або блокування:** {{ render_reason(execution_reason) }}

              **Реальні пари поточної моделі:** {{ c.get('samples', 0) }} · **Очікують факту:** {{ c.get('pending_count', 0) }}

              {%- if c.get('samples', 0) %}
              **MAE:** {{ ('%.2f'|format(c.mae_kwh)) if c.mae_kwh is not none else 'Дані недоступні' }} кВт·год · **Зсув (факт − прогноз):** {{ ('%.2f'|format(c.bias_kwh)) if c.bias_kwh is not none else 'Дані недоступні' }} кВт·год
              {%- else %}
              **Точність ще не виміряна:** очікуємо завершених пар цієї моделі.
              {%- endif %}

              Пари інших моделей збережено окремо: {{ c.get('excluded_model_pairs', 0) }}. Архівна перевірка не підвищує live confidence.

              | Дата | Виданий прогноз, кВт·год | Факт, кВт·год | Калібрує поточну модель |
              | --- | ---: | ---: | --- |
              {%- for p in c.get('recent_pairs', []) %}
              | {{ p.date }} | {{ ('%.2f'|format(p.forecast_kwh)) if p.forecast_kwh is not none else 'Дані недоступні' }} | {{ ('%.2f'|format(p.actual_kwh)) if p.actual_kwh is not none else 'Дані недоступні' }} | {{ 'так' if p.used_for_current_model else 'ні' }} |
              {%- endfor %}
              {%- for p in c.get('pending', []) %}
              | {{ p.date }} | {{ ('%.2f'|format(p.forecast_kwh)) if p.forecast_kwh is not none else 'Дані недоступні' }} | Дані недоступні | очікує · {{ 'очікуємо завершення доби' if p.awaiting == 'completed_day' else 'очікуємо дані API/recorder' }} |
              {%- endfor %}

              _AI лише рекомендує; HEMS вирішує, чи застосувати. «Застосовано: Так» означає прийняття AI-рекомендації HEMS, а не фізичну дію інвертора._
          - type: horizontal-stack
            cards:
              - type: button
                name: Підтвердити
                icon: mdi:check
                tap_action:
                  action: perform-action
                  perform_action: powmr_inverter.predictive_feedback
                  data:
                    action: approve
              - type: button
                name: Скасувати на 30 хв
                icon: mdi:pause
                tap_action:
                  action: perform-action
                  perform_action: powmr_inverter.predictive_feedback
                  data:
                    action: reject
                    duration_min: 30
          - type: markdown
            content: >-
              Assist вмикається вручну через наявний select прогнозної допомоги.
              Обери ціль SOC (20–100), щоб скоригувати рекомендацію та поставити
              HEMS на паузу на 30 хвилин. На час паузи HEMS утримує ручний контроль.
              Для кількох інверторів у кнопках потрібен entry_id.
          - type: markdown
            content: |
              # Налаштування HEMS
              Резерв SOC, тарифи та стратегія без редагування YAML.
          - type: entities
            title: Стратегія та режими
            show_header_toggle: false
            entities:
              - entity: select.smart_solar_inverter_smart_mode
                name: Активний режим HEMS
              - entity: switch.smart_solar_inverter_hems_auto_mode
                name: Авто-режим HEMS
              - entity: switch.smart_solar_inverter_eco_mode
                name: ECO режим
