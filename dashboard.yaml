title: Smart Solar Енергопанель
views:
  - title: Потужність
    path: powmr-power
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # Smart Solar Inverter
              Живий потік потужності, стан мережі та батареї в одному місці.
          - type: tile
            entity: binary_sensor.smart_solar_inverter_grid_available
            name: Стан мережі
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.smart_solar_inverter_working_mode
            name: Режим роботи
            icon: mdi:state-machine
          - type: tile
            entity: sensor.smart_solar_inverter_battery_soc_corrected
            name: Скоригований SOC
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.smart_solar_inverter_pv_surplus
            name: Надлишок PV
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.smart_solar_inverter_pv_surplus
            name: Надлишок PV
            icon: mdi:flash
          - type: tile
            entity: sensor.smart_solar_inverter_grid_voltage
            name: Напруга мережі
            icon: mdi:sine-wave
      - type: grid
        cards:
          - type: gauge
            entity: sensor.smart_solar_inverter_battery_soc_corrected
            name: SOC батареї
            min: 0
            max: 100
            severity:
              green: 45
              yellow: 25
              red: 0
          - type: gauge
            entity: sensor.smart_solar_inverter_pv_power
            name: Потужність PV
            min: 0
            max: 5000
            severity:
              green: 1200
              yellow: 400
              red: 0
          - type: gauge
            entity: sensor.smart_solar_inverter_load_power
            name: Потужність навантаження
            min: 0
            max: 5000
            severity:
              green: 0
              yellow: 2200
              red: 3600
          - type: statistics-graph
            title: Потік потужності (24г)
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - sensor.smart_solar_inverter_pv_power
              - sensor.smart_solar_inverter_load_power
              - sensor.smart_solar_inverter_grid_power
              - sensor.smart_solar_inverter_battery_power
          - type: statistics-graph
            title: SOC та струм батареї (24г)
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - sensor.smart_solar_inverter_battery_soc
              - sensor.smart_solar_inverter_battery_soc_corrected
              - sensor.smart_solar_inverter_battery_charge_current
          - type: custom:pv-comparison-card
            entity: sensor.smart_solar_inverter_pv_generation_curve
            forecast_entity: sensor.smart_solar_inverter_forecast_tomorrow
            title: Генерація та прогноз PV
      - type: grid
        cards:
          - type: entities
            title: Керування інвертором
            show_header_toggle: false
            entities:
              - entity: select.smart_solar_inverter_output_priority
                name: Пріоритет виходу
              - entity: select.smart_solar_inverter_charger_priority
                name: Пріоритет заряджання
              - entity: select.smart_solar_inverter_smart_mode
                name: Режим HEMS
              - entity: switch.smart_solar_inverter_hems_auto_mode
                name: Авто-режим HEMS
              - entity: switch.smart_solar_inverter_backup_mode
                name: Резервний режим
          - type: entities
            title: Струми та ліміти
            show_header_toggle: false
            entities:
              - entity: number.smart_solar_inverter_max_charging_current
                name: Макс. струм заряджання
              - entity: number.smart_solar_inverter_max_utility_charging_current
                name: Макс. струм заряду від мережі
              - entity: number.smart_solar_inverter_battery_charge_limit_percent
                name: Ліміт заряду АКБ
              - entity: number.smart_solar_inverter_battery_discharge_limit_percent
                name: Ліміт розряду АКБ
              - entity: number.smart_solar_inverter_grid_charge_power_limit
                name: Макс. потужність заряду (мережа)
          - type: entities
            title: Керування мережею
            show_header_toggle: false
            entities:
              - entity: switch.smart_solar_inverter_grid_charging
                name: Заряд від мережі
              - entity: switch.smart_solar_inverter_grid_feed_in
                name: Віддача в мережу
          - type: entities
            title: Поточний стан
            show_header_toggle: false
            entities:
              - entity: binary_sensor.smart_solar_inverter_grid_available
                name: Стан мережі
              - entity: sensor.smart_solar_inverter_pv_voltage
                name: Напруга PV
              - entity: sensor.smart_solar_inverter_grid_voltage
                name: Напруга мережі
              - entity: sensor.smart_solar_inverter_battery_voltage
                name: Напруга АКБ
              - entity: sensor.smart_solar_inverter_battery_current
                name: Струм батареї
              - entity: sensor.smart_solar_inverter_ac_output_power
                name: Вихідна потужність AC
              - entity: sensor.smart_solar_inverter_feed_in_power
                name: Віддача в мережу
              - entity: sensor.smart_solar_inverter_grid_import_power
                name: Споживання з мережі
          - type: entities
            title: 💰 Економіка
            show_header_toggle: false
            entities:
              - entity: sensor.smart_solar_inverter_daily_savings
                name: Валова оцінка вартості заміщеного імпорту · сьогодні (₴)
              - entity: sensor.smart_solar_inverter_monthly_savings
                name: Валова оцінка вартості заміщеного імпорту · місяць (₴)
              - entity: sensor.smart_solar_inverter_forecast_tomorrow
                name: Прогноз завтра (kWh)
              - entity: sensor.smart_solar_inverter_learned_ratio
                name: Коеф. конверсії PV
          - type: entities
            title: SOC: спостереження
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.smart_solar_inverter_battery_soc
                name: Повідомлено пристроєм (raw)
              - entity: sensor.smart_solar_inverter_battery_soc_corrected
                name: Чинний SOC керування
              - entity: sensor.smart_solar_inverter_battery_2
                name: Новий кандидат (control)
              - entity: sensor.smart_solar_inverter_battery_3
                name: Оцінка за напругою (діагностика)
              - entity: sensor.smart_solar_inverter_4
                name: Статус
          - type: markdown
            content: >-
              **Режим спостереження.** Новий розрахунок SOC v3 працює
              паралельно, **керування не змінено**. «Новий кандидат» — те,
              що контракт запропонував би як control; він поки нікуди не
              підключений.
          - type: statistics-graph
            title: Валова оцінка вартості заміщеного імпорту · денна накопичена за 24 години
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - entity: sensor.smart_solar_inverter_daily_savings
                name: Денний накопичений показник (UAH)
          - type: markdown
            content: Погодинне середнє накопиченої оцінки економії за добу. Показник скидається опівночі та після перезапуску інтеграції.
          - type: entities
            title: Прогноз сонячної генерації
            show_header_toggle: false
            entities:
              - entity: sensor.smart_solar_inverter_pv_power
                name: PV потужність (зараз)
              - entity: sensor.smart_solar_inverter_battery_soc_corrected
                name: SOC батареї

  - title: HEMS
    path: powmr-hems
    icon: mdi:brain
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            title: AI · рекомендація та виконання
            content: |
              {%- set STATE = 'sensor.smart_solar_inverter_predictive_decision_state' -%}
              {%- set SELECT = 'select.smart_solar_inverter_predictive_target_soc' -%}
              {%- set mode = state_attr(STATE, 'mode') -%}
              {%- set confidence = state_attr(STATE, 'confidence') -%}
              {%- set applied = state_attr(STATE, 'applied') -%}
              {%- set reason = state_attr(STATE, 'reason') -%}
              {%- set execution_reason = state_attr(STATE, 'execution_reason') -%}
              {%- set samples = state_attr(STATE, 'samples') -%}
              {%- set pause_until = state_attr(STATE, 'override_pending_until') -%}
              {%- set target_soc_attr = state_attr(SELECT, 'target_soc') -%}
              {%- set MODE_LABELS = {'Off': 'Вимкнено', 'Shadow': 'Спостереження', 'Assist': 'Підтримка'} -%}
              {%- set APPLIED_LABELS = {true: 'AI рекомендація прийнята HEMS', false: 'Рекомендацію AI не застосовано'} -%}
              {%- set REASON_LABELS = {
                'already_in_target': 'Уже в цілі — зміни не потрібні',
                'battery_drives_load': 'Батарея живить навантаження — підзарядка не потрібна',
                'day_pv_low': 'PV нижче споживання — берегти заряд',
                'hysteresis_recovery': 'Відновлення після паузи',
                'night_window_usb': 'Нічна USB-стратегія',
                'critical_recovery': 'Критичний SOC — відновити заряд',
                'surplus_enter_sbu': 'Надлишок PV — перейти в SBU',
                'reserve_soc_protection': 'SOC нижче резерву — захист',
                'evening_reserve_protection': 'Вечірній резерв',
                'emergency_low_soc_daytime': 'Аварійно низький SOC удень',
                'storm_mode': 'Штормовий режим — берегти заряд',
                'predictive_assist_evening': 'Підготувати SOC до вечора',
                'no_hint': 'Планувальник ще не сформував рекомендацію',
                'hems_auto_off': 'HEMS авто-режим вимкнено',
                'unknown_mode': 'Невідомий режим',
                'invalid_telemetry': 'Невалідні дані телеметрії',
                'soc_unknown': 'SOC невідомий — планувальник утримується',
                'day_default': 'Стандартна денна стратегія',
                'arbitrage_night': 'Арбітраж вночі',
                'arbitrage_day_sbu': 'Арбітраж удень (SBU)',
                'arbitrage_day_usb': 'Арбітраж удень (USB)',
                'forecast_good_use_battery': 'Прогноз сприятливий — використати батарею',
                'circuit_breaker': 'Захисне блокування HEMS',
                'reserve_floor': 'SOC на резервній межі',
                'dwell_lock': 'Утримання поточного режиму — мінімальний інтервал між змінами не минув',
              } -%}
              {%- macro fmt_pct(value) -%}
                {%- if value is none -%}Немає даних
                {%- else -%}{{ '{:.0f}'.format((value | float) * 100) }} %
                {%- endif -%}
              {%- endmacro -%}
              {%- macro short_reason(value) -%}
                {%- if value is none -%}Немає даних
                {%- elif value in REASON_LABELS -%}{{ REASON_LABELS[value] }}
                {%- else -%}
                  {%- set raw = (value | string) -%}
                  {%- set stripped = raw | regex_replace('^\\[ML\\]\\s*', '') -%}
                  {%- set head = stripped.split(':', 1)[0].strip() if ':' in stripped else stripped.strip() -%}
                  {{ REASON_LABELS.get(head, 'Невідомий reason') }}
                {%- endif -%}
              {%- endmacro -%}

              **Режим AI:** {{ MODE_LABELS.get(mode, 'Невідомо') }}

              **Впевненість:** {{ fmt_pct(confidence) }}

              **Застосування:** {{ APPLIED_LABELS.get(applied, 'Немає даних') }}

              **Причина рекомендації:** {{ short_reason(reason) }}

              **Причина виконання:** {{ short_reason(execution_reason) }}

              **Пари факт ↔ прогноз:** {% if samples is none %}Немає даних{% else %}{{ samples }}{% endif %}

              **Ручна пауза:** {{ ('Активна до ' ~ pause_until) if pause_until else 'Пауза не активна' }}

              {%- set target_soc_attr_rec = state_attr(SELECT, 'target_soc') -%}
              {%- set has_manual_rec = state_attr(SELECT, 'has_manual_target') -%}
              **Ручна ціль SOC:** {% if has_manual_rec is true and target_soc_attr_rec is number %}{{ target_soc_attr_rec | int }} % · ручну ціль задано · HEMS на паузі 30 хв. Скинути ручну ціль — схвали поточну AI-рекомендацію або скасуй паузу.{% elif has_manual_rec is sameas false %}Автоматично — ручну ціль не задано. Натисни кнопку «Задати ручну ціль SOC», щоб тимчасово скоригувати рекомендацію.{% elif has_manual_rec is none %}Контрол ще не завантажився — зачекай першого циклу.{% else %}Ручна ціль: {{ states(SELECT) }} % · HEMS на паузі 30 хв. Скинути ручну ціль — схвали поточну AI-рекомендацію або скасуй паузу.{% endif %}

              **Діагностика машинного коду:**
              {%- if mode is not none %}`mode = "{{ mode }}"`{% endif %}
              {%- if confidence is not none %}`confidence = {{ confidence }}`{% endif %}
              {%- if applied is not none %}`applied = {{ applied | string | lower }}`{% endif %}
              {%- if reason is not none %}`reason = "{{ reason }}"`{% endif %}
              {%- if execution_reason is not none %}`execution_reason = "{{ execution_reason }}"`{% endif %}
              {%- if samples is not none %}`samples = {{ samples }}`{% endif %}
              {%- if pause_until is not none %}`override_pending_until = "{{ pause_until }}"`{% endif %}
              {%- if target_soc_attr is not none %}`select.target_soc = {{ target_soc_attr }}`{% else %}`select.target_soc = null`{% endif %}

              _AI лише рекомендує; HEMS вирішує, чи застосувати. «Застосовано» означає прийняття AI-рекомендації HEMS, а не фізичну дію інвертора._

          - type: markdown
            title: AI · SOC-стан
            content: |
              {%- set SELECT = 'select.smart_solar_inverter_predictive_target_soc' -%}
              {%- set target_soc_attr = state_attr(SELECT, 'target_soc') -%}
              {%- set has_manual = state_attr(SELECT, 'has_manual_target') -%}
              {%- set raw_target = states(SELECT) -%}
              {%- set target_str = (raw_target | string | trim) -%}

              **Стан SOC-контролу:** {% if has_manual is true and target_soc_attr is number %}{{ target_soc_attr | int }} % · ручну ціль задано · HEMS на паузі 30 хв.{% elif has_manual is sameas false %}Автоматично — ручну ціль не задано. Планувальник сам обирає ціль. Обери 20–100 у more-info, щоб тимчасово скоригувати рекомендацію.{% elif has_manual is none %}Контрол ще не завантажився — зачекай першого циклу.{% else %}Ручна ціль: {{ target_str }} % · HEMS на паузі 30 хв.{% endif %}

              Обери значення 20–100 у more-info, щоб тимчасово скоригувати рекомендацію (HEMS на паузі 30 хв). Скинути ручну ціль — схвали поточну AI-рекомендацію або скасуй паузу.

              {%- if has_manual is true or target_soc_attr is number %}
              **Діагностика:** `target_soc = {{ target_soc_attr }}`, `has_manual_target = {{ (has_manual | default(false)) | string | lower }}`.
              {%- else %}
              **Діагностика:** `target_soc = null`, `has_manual_target = false`.
              {%- endif %}
          - type: button
            name: Задати ручну ціль SOC
            icon: mdi:battery-edit
            show_name: true
            show_icon: true
            tap_action:
              action: more-info
              entity: select.smart_solar_inverter_predictive_target_soc
          - type: markdown
            title: AI · навчання і точність
            content: |
              {%- set c = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'forecast_calibration') or {} -%}
              {%- set MODE_LABELS = {'Off': 'Вимкнено', 'Shadow': 'Спостереження', 'Assist': 'Підтримка'} -%}
              {%- set APPLIED_LABELS = {true: 'AI рекомендація прийнята HEMS', false: 'Рекомендацію AI не застосовано'} -%}
              {%- set REASON_LABELS = {
                'already_in_target': 'Уже в цілі — зміни не потрібні',
                'battery_drives_load': 'Батарея живить навантаження — підзарядка не потрібна',
                'day_pv_low': 'PV нижче споживання — берегти заряд',
                'hysteresis_recovery': 'Відновлення після паузи',
                'night_window_usb': 'Нічна USB-стратегія',
                'critical_recovery': 'Критичний SOC — відновити заряд',
                'surplus_enter_sbu': 'Надлишок PV — перейти в SBU',
                'reserve_soc_protection': 'SOC нижче резерву — захист',
                'evening_reserve_protection': 'Вечірній резерв',
                'emergency_low_soc_daytime': 'Аварійно низький SOC удень',
                'storm_mode': 'Штормовий режим — берегти заряд',
                'predictive_assist_evening': 'Підготувати SOC до вечора',
                'no_hint': 'Планувальник ще не сформував рекомендацію',
                'hems_auto_off': 'HEMS авто-режим вимкнено',
                'unknown_mode': 'Невідомий режим',
                'invalid_telemetry': 'Невалідні дані телеметрії',
                'soc_unknown': 'SOC невідомий — планувальник утримується',
                'day_default': 'Стандартна денна стратегія',
                'arbitrage_night': 'Арбітраж вночі',
                'arbitrage_day_sbu': 'Арбітраж удень (SBU)',
                'arbitrage_day_usb': 'Арбітраж удень (USB)',
                'forecast_good_use_battery': 'Прогноз сприятливий — використати батарею',
                'circuit_breaker': 'Захисне блокування HEMS',
                'reserve_floor': 'SOC на резервній межі',
                'dwell_lock': 'Утримання поточного режиму — мінімальний інтервал між змінами не минув',
              } -%}
              {%- macro short_reason(value) -%}
                {%- if value is none -%}
                  Немає даних
                {%- elif value in REASON_LABELS -%}
                  {{ REASON_LABELS[value] }}
                {%- else -%}
                  {%- set raw = (value | string) -%}
                  {%- set stripped = raw | regex_replace('^\\[ML\\]\\s*', '') -%}
                  {%- set head = stripped.split(':', 1)[0].strip() if ':' in stripped else stripped.strip() -%}
                  {{ REASON_LABELS.get(head, 'Невідомий reason') }}
                {%- endif -%}
              {%- endmacro -%}
              {%- macro fmt2(value) -%}
                {%- if value is none -%}
                  Немає даних
                {%- else -%}
                  {{ '{:.2f}'.format(value | float) }}
                {%- endif -%}
              {%- endmacro -%}
              {%- macro fmt_pct(value) -%}
                {%- if value is none -%}
                  Немає даних
                {%- else -%}
                  {{ '{:.0f}'.format((value | float) * 100) }} %
                {%- endif -%}
              {%- endmacro -%}
              {%- set model_key = c.get('forecast_model') -%}
              {%- set MODEL_LABELS = {
                'hourly_response_v1': 'Погодинна модель станції (v1)',
                'station_gain_v1': 'Добова модель станції (v1)',
                'hourly_response_v2': 'Погодинна модель станції (v2)',
                'station_gain_v2': 'Добова модель станції (v2)',
              } -%}

              **Модель:** {{ MODEL_LABELS.get(model_key, 'ще не визначена') }}

              {%- if has_value('sensor.smart_solar_inverter_predictive_decision_state') %}
              {%- set pause_until = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'override_pending_until') %}
              **Пауза:** {{ ('Пауза активна до ' ~ pause_until) if pause_until else 'Пауза не активна' }}
              {%- else %}
              **Пауза:** Немає даних
              {%- endif %}

              {%- set mode = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'mode') %}
              {%- set confidence = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'confidence') %}
              {%- set applied = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'applied') %}
              {%- set reason = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'reason') %}
              {%- set execution_reason = state_attr('sensor.smart_solar_inverter_predictive_decision_state', 'execution_reason') %}

              **Режим AI:** {{ MODE_LABELS.get(mode, 'Невідомо') }}
              **Впевненість:** {{ fmt_pct(confidence) }}
              **Застосовано:** {{ APPLIED_LABELS.get(applied, 'Немає даних') }}
              **Причина рекомендації:** {{ short_reason(reason) }}
              **Причина виконання:** {{ short_reason(execution_reason) }}

              **Пари поточної моделі:** {{ c.get('samples', 0) }} · **Очікують факту:** {{ c.get('pending_count', 0) }}

              {%- if c.get('samples', 0) %}
              **MAE:** {{ fmt2(c.mae_kwh) }} кВт·год · **Зсув (факт − прогноз):** {{ fmt2(c.bias_kwh) }} кВт·год
              {%- else %}
              **Точність ще не виміряна:** очікуємо завершених пар цієї моделі.
              {%- endif %}

              Парі інших моделей збережено окремо: {{ c.get('excluded_model_pairs', 0) }}. Архівна перевірка не підвищує live confidence.

              **Поточний оновлений прогноз** (live sensor value, оновлюється що 15 хв):
              {%- set ft = states('sensor.smart_solar_inverter_forecast_tomorrow') %}
              {%- set fa = state_attr('sensor.smart_solar_inverter_forecast_tomorrow', 'forecast_diagnostic') or {} %}
              {%- set loc = state_attr('sensor.smart_solar_inverter_forecast_tomorrow', 'forecast_location') or {} %}
              {%- if ft in ['unknown', 'unavailable', 'None', 'none', ''] %}
                — **Немає даних.** Перезапусти інтеграцію або зачекай першого циклу.
              {%- else %}
                — {{ fmt2(ft) }} кВт·год (на завтра).
                {%- if loc.get('latitude') is not none and loc.get('longitude') is not none %}
                  Місцевість: {{ '{:.4f}'.format(loc.get('latitude') | float) }}°, {{ '{:.4f}'.format(loc.get('longitude') | float) }}° · {{ loc.get('timezone') or '—' }} · джерело: {{ loc.get('source') or '—' }}.
                {%- endif %}
              {%- endif %}

              **Зафіксовані прогнози та факти** (snapshot pipeline, незмінні):

              | Дата | Прогноз, кВт·год | Факт, кВт·год | Δ факт−прогноз, кВт·год | Калібрує модель |
              | --- | ---: | ---: | ---: | --- |
              {%- for p in c.get('recent_pairs', []) %}
              | {{ p.date }} | {{ fmt2(p.forecast_kwh) }} | {{ fmt2(p.actual_kwh) }} | {% if p.actual_kwh is not none and p.forecast_kwh is not none %}{{ fmt2((p.actual_kwh | float) - (p.forecast_kwh | float)) }}{% else %}—{% endif %} | {{ 'так' if p.used_for_current_model else 'ні' }} |
              {%- endfor %}
              {%- for p in c.get('pending', []) %}
              | {{ p.date }} | {{ fmt2(p.forecast_kwh) }} | {% if p.awaiting == 'completed_day' %}Очікуємо завершення доби{% elif p.actual_kwh is none %}Немає даних{% else %}{{ fmt2(p.actual_kwh) }} / {{ fmt2((p.actual_kwh | float) - (p.forecast_kwh | float)) }}{% endif %} | — | ні |
              {%- endfor %}
              {%- if c.get('recent_pairs') or c.get('pending') %}
              {%- else %}
              _Поки що немає завершених пар. Таблиця оновиться після першої пари прогноз↔факт._
              {%- endif %}

              **Діагностика машинного коду:**
              {%- if reason is not none %}
              `decision.reason = "{{ reason }}"`
              {%- endif %}
              {%- if execution_reason is not none %}
              `decision.execution_reason = "{{ execution_reason }}"`
              {%- endif %}
              {%- if model_key is not none %}
              `forecast_model = "{{ model_key }}"`
              {%- endif %}

              _AI лише рекомендує; HEMS вирішує, чи застосувати. «Застосовано» означає прийняття AI-рекомендації HEMS, а не фізичну дію інвертора._
          - type: horizontal-stack
            cards:
              - type: button
                name: Підтвердити
                icon: mdi:check
                tap_action:
                  action: perform-action
                  perform_action: powmr_inverter.predictive_feedback
                  data:
                    action: approve
              - type: button
                name: Скасувати на 30 хв
                icon: mdi:pause
                tap_action:
                  action: perform-action
                  perform_action: powmr_inverter.predictive_feedback
                  data:
                    action: reject
                    duration_min: 30
          - type: markdown
            content: >-
              Assist вмикається вручну через наявний select прогнозної допомоги.
              Обери ціль SOC (20–100), щоб скоригувати рекомендацію та поставити
              HEMS на паузу на 30 хвилин. На час паузи HEMS утримує ручний контроль.
              Для кількох інверторів у кнопках потрібен entry_id.
          - type: markdown
            title: Прогноз · фактична місцевість
            content: |
              {%- set loc = state_attr('sensor.smart_solar_inverter_forecast_tomorrow', 'forecast_location') or {} -%}
              {%- set source = loc.get('source') -%}
              {%- set SOURCE_LABELS = {
                'entry': 'Стеція · задане в options flow (site_latitude / site_longitude)',
                'ha': 'Home Assistant · hass.config.latitude / hass.config.longitude',
                'default': 'Інтеграційний fallback (DEFAULT_SITE_LATITUDE / DEFAULT_SITE_LONGITUDE)',
                'unknown': 'невідомо',
              } -%}
              {%- if loc.get('latitude') is none -%}
                **Координати прогнозу:** дані ще не готові. Перезапусти інтеграцію або зачекай першого циклу оновлення.
              {%- else -%}
                **Координати прогнозу:** {{ '{:.4f}'.format(loc.get('latitude') | float) }}°, {{ '{:.4f}'.format(loc.get('longitude') | float) }}°
                **Часовий пояс:** {{ loc.get('timezone') or '—' }}
                **Джерело:** {{ SOURCE_LABELS.get(source, source) }}

                Якщо джерело — `Home Assistant`, прогноз успадковує локацію HA; щоб задати окрему точку для PV-станції, обери `site_latitude` / `site_longitude` в options flow.
              {%- endif -%}
          - type: markdown
            content: |
              # Налаштування HEMS
              Резерв SOC, тарифи та стратегія без редагування YAML.
          - type: entities
            title: Стратегія та режими
            show_header_toggle: false
            entities:
              - entity: select.smart_solar_inverter_smart_mode
                name: Активний режим HEMS
              - entity: switch.smart_solar_inverter_hems_auto_mode
                name: Авто-режим HEMS
              - entity: switch.smart_solar_inverter_eco_mode
                name: ECO режим
