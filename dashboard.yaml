        \ 0) }}\n\n{%- if c.get('samples', 0) %}\n**MAE:** {{ fmt2(c.mae_kwh) }} кВт·год\
        \ · **Зсув (факт − прогноз):** {{ fmt2(c.bias_kwh) }} кВт·год\n{%- else %}\n\
        **Точність ще не виміряна:** очікуємо завершених пар цієї моделі.\n{%- endif\
        \ %}\n\nПарі інших моделей збережено окремо: {{ c.get('excluded_model_pairs',\
        \ 0) }}. Архівна перевірка не підвищує live confidence.\n\n**Поточний оновлений\
        \ прогноз** (live sensor value, оновлюється що 15 хв):\n{%- set ft = states('sensor.smart_solar_inverter_forecast_tomorrow')\
        \ %}\n{%- set fa = state_attr('sensor.smart_solar_inverter_forecast_tomorrow',\
        \ 'forecast_diagnostic') or {} %}\n{%- set loc = state_attr('sensor.smart_solar_inverter_forecast_tomorrow',\
        \ 'forecast_location') or {} %}\n{%- if ft in ['unknown', 'unavailable', 'None',\
        \ 'none', ''] %}\n  — **Немає даних.** Перезапусти інтеграцію або зачекай\
        \ першого циклу.\n{%- else %}\n  — {{ fmt2(ft) }} кВт·год (на завтра).\n \
        \ {%- if loc.get('latitude') is not none and loc.get('longitude') is not none\
        \ %}\n    Місцевість: {{ '{:.4f}'.format(loc.get('latitude') | float) }}°,\
        \ {{ '{:.4f}'.format(loc.get('longitude') | float) }}° · {{ loc.get('timezone')\
        \ or '—' }} · джерело: {{ loc.get('source') or '—' }}.\n  {%- endif %}\n{%-\
        \ endif %}\n\n**Зафіксовані прогнози та факти** (snapshot pipeline, незмінні):\n\
        \n| Дата | Прогноз, кВт·год | Факт, кВт·год | Δ факт−прогноз, кВт·год | Калібрує\
        \ модель |\n| --- | ---: | ---: | ---: | --- |\n{%- for p in c.get('recent_pairs',\
        \ []) %}\n| {{ p.date }} | {{ fmt2(p.forecast_kwh) }} | {{ fmt2(p.actual_kwh)\
        \ }} | {% if p.actual_kwh is not none and p.forecast_kwh is not none %}{{\
        \ fmt2((p.actual_kwh | float) - (p.forecast_kwh | float)) }}{% else %}—{%\
        \ endif %} | {{ 'так' if p.used_for_current_model else 'ні' }} |\n{%- endfor\
        \ %}\n{%- for p in c.get('pending', []) %}\n| {{ p.date }} | {{ fmt2(p.forecast_kwh)\
        \ }} | {% if p.awaiting == 'completed_day' %}Очікуємо завершення доби{% elif\
        \ p.actual_kwh is none %}Немає даних{% else %}{{ fmt2(p.actual_kwh) }} / {{\
        \ fmt2((p.actual_kwh | float) - (p.forecast_kwh | float)) }}{% endif %} |\
        \ — | ні |\n{%- endfor %}\n{%- if c.get('recent_pairs') or c.get('pending')\
        \ %}\n{%- else %}\n_Поки що немає завершених пар. Таблиця оновиться після\
        \ першої пари прогноз↔факт._\n{%- endif %}\n\n**Діагностика машинного коду:**\n\
        {%- if reason is not none %}\n`decision.reason = \"{{ reason }}\"`\n{%- endif\
        \ %}\n{%- if execution_reason is not none %}\n`decision.execution_reason =\
        \ \"{{ execution_reason }}\"`\n{%- endif %}\n{%- if model_key is not none\
        \ %}\n`forecast_model = \"{{ model_key }}\"`\n{%- endif %}\n\n_AI лише рекомендує;\
        \ HEMS вирішує, чи застосувати. «Застосовано» означає прийняття AI-рекомендації\
        \ HEMS, а не фізичну дію інвертора._\n"
