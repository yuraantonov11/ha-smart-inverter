<!doctype html>
<!--
  Harness for the manual outage-scenarios card.

  The card at ../../frontend/k-outage-scenarios-card.js
  is a self-contained Web Component. We load it via a
  plain ``<script src>`` so the real (un-mocked)
  ``customElements.define`` runs -- this catches real
  JS bugs the JS-only stubs can't.

  ``window.__harness`` records every call the card makes
  to ``callService`` so the Python test can read them
  back via ``page.evaluate()`` and assert on the
  payload. The Python test seeds ``window.__harness``
  with a canned ``listResponse`` and a
  ``computePlanResponse`` BEFORE the card is attached,
  so the very first ``hass = `` assignment (which
  triggers ``_refresh``) returns the seeded events.

  DEFECT 1 (callService arg order): the harness
  records the FULL positional ``arguments`` so the
  Python test can assert that the 5th argument is
  ``notifyOnError`` and the 6th is ``returnResponse``.
  Responses are wrapped in ``{context, response}``
  per the documented
  ``ServiceCallResponse<T> = { context: Context;
  response?: T }`` shape -- the production HA
  frontend returns the handler payload at
  ``res.response.response``.

  No live HA, no auth -- the entire test is offline.
-->
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>k-outage-scenarios-card harness</title>
    <style>
      /* Ensure the harness page itself never adds
         a horizontal scrollbar -- the
         ``viewports_360_and_1280_no_clipping`` test
         sizes the viewport at 360 px and asserts
         that ``document.documentElement.scrollWidth``
         does not exceed the viewport width. */
      html, body { margin: 0; padding: 0; overflow-x: hidden; }
      body {
        font-family: system-ui;
        background: #1c1c1c;
        color: #fff;
        padding: 12px;
        box-sizing: border-box;
      }
      k-outage-scenarios-card { display: block; max-width: 800px; width: 100%; }
    </style>
    <script>
      // ---------------------------------------------------------------------
      // Harness state -- mutable per-test.
      // ---------------------------------------------------------------------
      window.__harness = {
        // ``list_outage_events`` payload. The card calls
        // this on ``set hass`` and after every add/edit/
        // cancel. ``Promise.resolve`` defers the resolution
        // one microtick so the async path is exercised.
        // ``listResponse`` is the wrapped shape the card
        // expects after DEFECT 1: ``res.response.response``
        // holds the handler payload. The harness returns
        // ``{context: {id: '...'}, response: <payload>}``.
        listResponse: {
          context: { id: "harness-list" },
          response: { events: [] },
        },
        // ``<entry_id>_compute_outage_plan`` payload.
        // Same wrap: ``{context, response: <payload>}``.
        computePlanResponse: {
          context: { id: "harness-plan" },
          response: {
            planned: true,
            blocked: false,
            plan: {
              attainable_target_soc_pct: 80,
              energy_needed_kwh: 4.0,
              energy_available_kwh: 6.5,
              energy_reserve_kwh: 0.5,
              needs_charging_from_grid_kwh: 0.0,
              grid_charge_hours_per_hour: 0.0,
              prep_start_iso: "2026-10-20T06:00:00+03:00",
            },
            reason_if_blocked: null,
            reason_if_incomplete: null,
          },
        },
        // Which ``returnResponse`` path to surface.
        // ``"wrapped"`` -> ``res.response = payload``.
        // ``"bare"``   -> ``res = payload`` directly.
        // ``"auto"``   -> ``res.response`` for ``list_*`` /
        //                 compute, plain ``undefined``
        //                 otherwise.
        responseShape: "wrapped",
        // Recorded calls. The card fires
        // ``hass.callService(domain, service, data,
        //  target, notifyOnError, returnResponse)``.
        // We capture the FULL positional ``arguments``
        // so the Python test can assert on each
        // position individually (DEFECT 1).
        calls: [],
        // Optional error to throw from the next
        // ``callService`` invocation (one-shot).
        nextError: null,
        hass: null,
      };

      // ---------------------------------------------------------------------
      // Stub ``hass``: records calls, returns canned
      // payloads, supports ``config.time_zone``.
      // ---------------------------------------------------------------------
      function makeHass() {
        return {
          config: {
            time_zone:
              window.__harness.timeZone || "Europe/Kyiv",
          },
          callService: function (domain, service, data, target, notifyOnError, returnResponse) {
            // Record the call.  We capture ``arguments``
            // by value so a later mutation of
            // ``window.__harness`` can't rewrite history.
            var args = Array.prototype.slice.call(arguments);
            // DEFECT 1: assert-friendly shape. The
            // Python test inspects ``argNotifyOnError``
            // / ``argReturnResponse`` directly to
            // assert the positional contract.
            window.__harness.calls.push({
              domain: domain,
              service: service,
              data: data || {},
              // Positional slots -- the test asserts
              // ``argReturnResponse === true`` and
              // ``argNotifyOnError === false`` per
              // the documented ``callService``
              // signature.
              argTarget: target === undefined ? null : target,
              argNotifyOnError: notifyOnError === true,
              argReturnResponse: returnResponse === true,
              ts: Date.now(),
            });
            // Simulated failure.
            if (window.__harness.nextError) {
              var err = window.__harness.nextError;
              window.__harness.nextError = null;
              return Promise.reject(
                err instanceof Error ? err : new Error(String(err))
              );
            }
            // Pick the response shape.
            var shape = window.__harness.responseShape;
            var wrapped = null;
            if (service === "list_outage_events") {
              wrapped = window.__harness.listResponse;
            } else if (service.indexOf("_compute_outage_plan") !== -1) {
              wrapped = window.__harness.computePlanResponse;
            }
            if (shape === "bare") {
              // Bare path: the response IS the payload
              // (no ``res.response`` wrap). The card's
              // defensive triple-path should still find
              // ``events`` at the top level.
              var payload = null;
              if (service === "list_outage_events") {
                payload = window.__harness.listResponse.response;
              } else if (service.indexOf("_compute_outage_plan") !== -1) {
                payload = window.__harness.computePlanResponse.response;
              }
              return Promise.resolve(payload || undefined);
            }
            // Default ``wrapped`` shape -- the card
            // expects ``res.response.response``.
            if (wrapped) return Promise.resolve(wrapped);
            return Promise.resolve(undefined);
          },
          // The card doesn't read states but we provide
          // it for completeness so a stray lookup
          // doesn't throw.
          states: {},
          // Just-in-case defaults.
          user: { name: "Harness" },
          panels: {},
        };
      }

      window.__harness.makeHass = makeHass;
    </script>
    <script src="../../frontend/k-outage-scenarios-card.js"></script>
  </head>
  <body>
    <k-outage-scenarios-card
      entry_id="01M3XWJ8DRYDQC8A0NCPRVB53N"
    ></k-outage-scenarios-card>
    <script>
      // Wire the card once it has been upgraded. The
      // custom element's ``set hass`` triggers a
      // ``list_outage_events`` call, so the seeded
      // canned payload (set in the test) is already
      // visible by the time the next paint fires.
      function attach() {
        var el = document.querySelector(
          "k-outage-scenarios-card"
        );
        if (!el) {
          // The element hasn't upgraded yet. Wait one
          // microtask and retry.
          return Promise.resolve().then(attach);
        }
        // Pull the (possibly test-overridden)
        // ``hassTimeZone`` so the very first card
        // rendering honours it. We also call
        // ``setConfig`` with the
        // ``entry_id`` attribute (if any) so the
        // card's internal ``this._config.entry_id``
        // is populated -- this mirrors what HA does
        // when it instantiates the card via the
        // ``custom:...`` widget registry.
        var tz =
          (window.__harness && window.__harness.timeZone) ||
          "Europe/Kyiv";
        var cfg = { type: "custom:k-outage-scenarios-card" };
        var attrEntry = el.getAttribute("entry_id");
        if (attrEntry) cfg.entry_id = attrEntry;
        try {
          el.setConfig(cfg);
        } catch (e) {
          // ``setConfig`` throws on invalid type,
          // but we set the type above so this
          // should never happen.  We log for
          // diagnostic purposes only.
          console.warn(
            "[harness] setConfig failed:", e
          );
        }
        var hass = window.__harness.makeHass();
        hass.config.time_zone = tz;
        window.__harness.hass = hass;
        el.hass = hass;
        window.__card = el;
        return Promise.resolve();
      }
      attach();
    </script>
  </body>
</html>
