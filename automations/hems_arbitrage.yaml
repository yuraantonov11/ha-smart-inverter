# ============================================================================
# ADVISORY AUTOMATION — monitoring-only
# ============================================================================
# T24 round 3: this
# automation is
# *monitoring-only*.
# It does NOT
# write any
# inverter state.
# The night/day
# arbitrage response
# (output=USB, charger=SNU
# at night, output=SBU,
# charger=OSO during day)
# is the coordinator's
# responsibility.
#
# This YAML fires
# notifications at
# the configured
# transition times so
# you have an audit
# trail in HA's
# logbook outside the
# coordinator's own
# debug log.
#
# Recommended setup
# is to disable this
# YAML — the
# coordinator already
# logs every
# arbitrage
# transition. The
# notification here
# is for users who
# want a phone push.
#
# Legacy control
# automation
# (output=USB,
# charger=SNU,
# etc.) has been
# moved to
# ``legacy_hems_arbitrage_control.yaml``
# and is *dormant* —
# do NOT enable it
# unless you have a
# documented reason.
# ============================================================================

alias: "HEMS — Night Arbitrage (advisory notifications)"
description: |
  Send a mobile push at night-tariff transition points.
  No inverter state is written.
mode: single

trigger:
  - platform: time
    at: "23:00:00"
  - platform: time
    at: "07:00:00"

condition:
  - condition: state
    entity_id: select.garazh_smart_solar_inverter_hems_smart_mode
    state: "Arbitrage"

action:
  - variables:
      hour: "{{ now().hour }}"

  - if:
      - condition: template
        value_template: "{{ hour == 23 }}"
    then:
      - service: notify.mobile_app_phone
        data:
          title: "🌙 Arbitrage — night window"
          message: >
            Cheap-tariff window starts. Coordinator will drive grid charging.
          data:
            push:
              sound: "default"

      - service: logbook.log
        data:
          name: "HEMS Arbitrage"
          message: "Night window — coordinator will drive grid charging"
          domain: Inverter_inverter

  - if:
      - condition: template
        value_template: "{{ hour == 7 }}"
    then:
      - service: notify.mobile_app_phone
        data:
          title: "☀ Arbitrage — day window"
          message: >
            Expensive-tariff window starts. Coordinator will switch to solar priority.
          data:
            push:
              sound: "default"

      - service: logbook.log
        data:
          name: "HEMS Arbitrage"
          message: "Day window — coordinator will switch to solar priority"
          domain: Inverter_inverter