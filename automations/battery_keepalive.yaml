# ============================================================================
# ADVISORY AUTOMATION — coordinator owns the decision pipeline
# ============================================================================
# This YAML is a recommended example. The actual HEMS engine
# runs in the Python coordinator (``_run_hems_engine``) and
# is the single source of truth for control decisions. This
# automation only adds supplementary logging, notifications,
# or scheduled overrides (e.g. night arbitrage trigger).
#
# Entity IDs below assume the device name
# ``garazh_smart_solar_inverter`` (the live prefix in your
# setup). If you renamed the device, update each entity_id.
#
# Placeholders you must fill in:
#   * ``notify.mobile_app_phone`` — replace with the
#     notification service id from your mobile_app
#     integration, or remove the notify actions.
#
# Coordinator safety guards still apply: HEMS_AUTO_MODE off,
# HEMS in monitor-only mode, or a missing sensor all cancel
# the write. The coordinator's ``check_keepalive`` and
# ``_track_battery_activity`` are the only entities that
# may issue a control command; this automation may issue
# a ``select.select_option`` request but the coordinator
# can still reject it via the circuit breaker.
# ============================================================================

# ============================================================================
# Battery Keepalive Automation — DORMANT REFERENCE
# ============================================================================
# This YAML is the original ``siseli-app`` keepalive logic.
# The HEMS engine in ``hems/engine.py`` (``check_keepalive``)
# is the single active owner. Calling
# ``select.select_option`` from BOTH the Python engine and
# this YAML would create two writers and violate the audit's
# single-owner rule. The condition ``{{ false }}`` below
# disables the actions without removing the file so the
# original behaviour stays documented.
# ============================================================================
# Performs a brief discharge cycle every 2 hours to prevent
# battery BMS from entering sleep mode due to prolonged inactivity.
#
# KEY FIX: Switches OUTPUT priority to SBU (forces battery discharge)
# rather than just toggling charger. This matches the original siseli-app
# behavior where _batteryKeepalive() switches output to SBU for 90 seconds
# then back to USB.
#
# When on USB mode with no battery activity for 2+ hours:
#   1. Switch output to SBU → battery discharges briefly (wakes BMS)
#   2. Wait 90 seconds
#   3. Switch output back to USB → resume normal operation
# ============================================================================

alias: "Battery Keepalive (DORMANT — coordinator owns keepalive)"
description: "Reference only. The HEMS engine in coordinator.py is the single active owner of battery keepalive. This automation is intentionally kept here as a documented example but is disabled via a never-true condition. Do NOT enable without first removing the Python check_keepalive path."
description: "Brief discharge cycle to prevent BMS sleep — switches OUTPUT to SBU"
mode: single

# ── DORMANT: this automation never runs while the Python
# coordinator owns keepalive. The first condition is hard-wired
# to false so the trigger fires into a no-op. Removing this
# line WITHOUT also removing ``check_keepalive`` in the
# Python engine would cause two owners to fight over the
# same command path.
trigger:
  - platform: time_pattern
    minutes: "/30"

condition:
  # DORMANT: this MUST stay as the first condition.
  - condition: template
    value_template: "{{ false }}"
  # The original conditions are preserved below for documentation
  # but never reached because the {{ false }} above short-circuits
  # the AND chain.
  - condition: state
    entity_id: switch.garazh_smart_solar_inverter_hems_auto_mode
    state: "on"
  - condition: template
    value_template: >
      {% set soc = states('sensor.garazh_smart_solar_inverter_battery_soc_corrected') | float(50) %}
      {{ soc > 22 }}
  # Only run if output is currently USB (grid priority) — that's when battery sleeps
  - condition: template
    value_template: >
      {{ states('select.garazh_smart_solar_inverter_output_priority') == 'USB (Grid First)' }}

action:
  - variables:
      battery_power: "{{ states('sensor.garazh_smart_solar_inverter_battery_power') | float(0) }}"
      # Battery inactive if |power| < 50W
      inactive: "{{ (battery_power | abs) < 50 }}"
      current_output: "{{ states('select.garazh_smart_solar_inverter_output_priority') }}"

  - if:
      - condition: template
        value_template: "{{ inactive }}"
    then:
      # Switch OUTPUT priority to SBU — forces battery to discharge briefly
      # This wakes the BMS from sleep mode
      - service: select.select_option
        target:
          entity_id: select.garazh_smart_solar_inverter_output_priority
        data:
          option: "SBU (Solar/Battery First)"
      - delay:
          seconds: 90
      # Restore original output priority
      - service: select.select_option
        target:
          entity_id: select.garazh_smart_solar_inverter_output_priority
        data:
          option: "{{ current_output }}"
      - service: logbook.log
        data:
          name: "Battery Keepalive"
          message: "Keepalive cycle completed — output SBU→USB (90 sec discharge to wake BMS)"
          domain: powmr_inverter
