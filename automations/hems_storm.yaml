# ============================================================================
# ADVISORY AUTOMATION — coordinator owns the decision pipeline
# ============================================================================
# This YAML is a recommended example. The actual HEMS engine
# runs in the Python coordinator (``_run_hems_engine``) and
# is the single source of truth for control decisions. This
# automation only adds supplementary logging, notifications,
# or scheduled overrides (e.g. night arbitrage trigger).
#
# Entity IDs below assume the device name
# ``garazh_smart_solar_inverter`` (the live prefix in your
# setup). If you renamed the device, update each entity_id.
#
# Placeholders you must fill in:
#   * ``notify.mobile_app_phone`` — replace with the
#     notification service id from your mobile_app
#     integration, or remove the notify actions.
#
# Coordinator safety guards still apply: HEMS_AUTO_MODE off,
# HEMS in monitor-only mode, or a missing sensor all cancel
# the write. The coordinator's ``check_keepalive`` and
# ``_track_battery_activity`` are the only entities that
# may issue a control command; this automation may issue
# a ``select.select_option`` request but the coordinator
# can still reject it via the circuit breaker.
# ============================================================================

# ============================================================================
# HEMS Storm / Reserve Mode Automation
# ============================================================================
# Maintains full battery for grid outage resilience.
# Charger = SNU (grid can charge), Output = SBU (battery first).
# ============================================================================

alias: "HEMS — Storm Mode"
description: "Keep battery charged for grid outage resilience"
mode: single

trigger:
  - platform: state
    entity_id: select.garazh_smart_solar_inverter_hems_smart_mode
    to: "Storm"
  - platform: time_pattern
    minutes: "/5"

condition:
  - condition: state
    entity_id: select.garazh_smart_solar_inverter_hems_smart_mode
    state: "Storm"
  - condition: state
    entity_id: switch.garazh_smart_solar_inverter_hems_auto_mode
    state: "on"

action:
  - variables:
      current_output: "{{ states('select.garazh_smart_solar_inverter_output_priority') }}"
      current_charger: "{{ states('select.garazh_smart_solar_inverter_charger_priority') }}"

  # Keep charger on SNU (grid can top up)
  - if:
      - condition: template
        value_template: "{{ current_charger != 'SNU (Solar + Utility)' }}"
    then:
      - service: select.select_option
        target:
          entity_id: select.garazh_smart_solar_inverter_charger_priority
        data:
          option: "SNU (Solar + Utility)"

  # Keep output on SBU (use battery first, grid as backup)
  - if:
      - condition: template
        value_template: "{{ current_output != 'SBU (Solar/Battery First)' }}"
    then:
      - service: select.select_option
        target:
          entity_id: select.garazh_smart_solar_inverter_output_priority
        data:
          option: "SBU (Solar/Battery First)"
