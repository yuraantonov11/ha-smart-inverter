# ============================================================================
# ADVISORY AUTOMATION — monitoring-only
# ============================================================================
# T24 round 3: this
# automation is
# *monitoring-only*.
# It does NOT
# write any
# inverter state.
# The Storm-mode
# response
# (charger=SNU,
# output=SBU,
# manual hold,
# etc.) is the
# coordinator's
# responsibility.
#
# This YAML fires
# a single
# notification
# when the user
# switches to
# Storm mode so
# you have an
# audit trail in
# the Home
# Assistant log
# outside the
# coordinator's
# own debug log.
#
# Recommended setup
# is to disable this
# YAML — the
# coordinator already
# logs every Storm
# transition. The
# notification here
# is for users who
# want a phone push.
#
# Legacy control
# automation
# (charger=SNU,
# output=SBU) has
# been moved to
# ``legacy_hems_storm_control.yaml``
# and is *dormant* —
# do NOT enable it
# unless you have
# a documented
# reason (it will
# race the
# coordinator).
# ============================================================================

alias: "HEMS — Storm Mode (advisory notification)"
description: |
  Send a mobile push when the HEMS user mode is set to Storm.
  No inverter state is written.
mode: single

trigger:
  - platform: state
    entity_id: select.garazh_smart_solar_inverter_hems_smart_mode
    to: "Storm"

condition: []

action:
  - variables:
      soc: "{{ states('sensor.garazh_smart_solar_inverter_battery_soc_corrected') | float(0) }}"
      pv_w: "{{ states('sensor.garazh_smart_solar_inverter_pv_input_power') | float(0) }}"
      grid_v: "{{ states('sensor.garazh_smart_solar_inverter_grid_voltage') | float(0) }}"

  - service: notify.mobile_app_phone
    data:
      title: "⛈ HEMS Storm Mode active"
      message: >
        Storm mode entered. The coordinator will drive the inverter.
        Battery SOC: {{ soc }}%, PV: {{ pv_w }}W, Grid: {{ grid_v }}V.
      data:
        push:
          sound: "default"
          importance: "high"
        ttl: 0
        priority: "high"

  - service: logbook.log
    data:
      name: "HEMS"
      message: "User selected Storm mode (advisory notification only; coordinator owns control)"
      domain: Inverter_inverter