# ============================================================================
# DORMANT AUTOMATION — DO NOT ENABLE
# ============================================================================
# ADVISORY AUTOMATION — coordinator owns the decision pipeline.
# This YAML is a legacy control automation that is preserved for historical
# reference but must NOT be enabled. The Python coordinator is the sole
# owner of HEMS control decisions. Placeholders you must fill in
# (if you ever enable this file):
#   * ``notify.mobile_app_phone`` — replace with the notification service
#     id from your mobile_app integration.
# Entity IDs assume ``garazh_smart_solar_inverter`` — the live prefix in
# your setup. If you renamed the device, update each entity_id.
# ============================================================================
# This is the *legacy*
# Storm-mode control
# automation that was
# shipped in earlier
# versions of this
# integration. It issued
# ``select.select_option``
# calls to the inverter
# directly. That path is
# now handled by the
# Python coordinator
# (``_run_hems_engine``).
#
# Why this is dormant:
#
#     * ``select.select_option``
#       on
#       ``select.garazh_smart_solar_inverter_output_priority``
#       and the charger
#       priority entity
#       calls the inverter
#       API *immediately* —
#       the coordinator
#       guards (manual
#       hold, circuit
#       breaker, BMS,
#       reserve SOC,
#       storm hard
#       floor, hysteresis)
#       are not consulted.
#       Two writers race
#       each other.
#     * The audit explicitly
#       required that
#       *only the
#       coordinator*
#       issues control
#       commands while
#       ``hems_auto_mode``
#       is on.
#     * Manual override
#       holds and the
#       circuit breaker
#       are not honoured
#       by YAML, so a
#       user-triggered
#       command here
#       can race past a
#       safety floor
#       (API spy
#       confirmed the
#       write even with
#       an active manual
#       hold).
#
# What to do:
#
#     * If you imported
#       this YAML into HA
#       and it is enabled,
#       *disable* it
#       immediately.
#     * If you want the
#       legacy behaviour
#       for a documented
#       reason (e.g.
#       ``hems_auto_mode``
#       off AND you
#       understand the
#       safety trade-off),
#       remove the
#       ``condition``
#       short-circuit
#       below and rename
#       the file. The
#       audit does not
#       allow this
#       automation to be
#       enabled by
#       default.
# ============================================================================

alias: "DORMANT legacy — HEMS Storm control (do not enable)"
description: |
  DORMANT — legacy control automation. The Python coordinator owns the
  HEMS decision pipeline. This file is preserved for historical reference
  and must not be enabled. The ``{{ false }}`` condition below ensures
  the automation never fires; if you delete that condition, the
  automation will race the coordinator on every Storm-mode tick.
mode: single

trigger:
  - platform: time_pattern
    minutes: "/5"

condition:
  # Short-circuit:
  # the trigger fires
  # but the
  # automation
  # never runs.
  - condition: template
    value_template: "{{ false }}"

action:
  - variables:
      current_output: "{{ states('select.garazh_smart_solar_inverter_output_priority') }}"
      current_charger: "{{ states('select.garazh_smart_solar_inverter_charger_priority') }}"

  # Legacy block —
  # disabled by the
  # ``{{ false }}``
  # condition above.
  - if:
      - condition: state
        entity_id: select.garazh_smart_solar_inverter_hems_smart_mode
        state: "Storm"
      - condition: template
        value_template: "{{ current_charger != 'SNU (Solar + Utility)' }}"
    then:
      - service: select.select_option
        target:
          entity_id: select.garazh_smart_solar_inverter_charger_priority
        data:
          option: "SNU (Solar + Utility)"

  - if:
      - condition: state
        entity_id: select.garazh_smart_solar_inverter_hems_smart_mode
        state: "Storm"
      - condition: template
        value_template: "{{ current_output != 'SBU (Solar/Battery First)' }}"
    then:
      - service: select.select_option
        target:
          entity_id: select.garazh_smart_solar_inverter_output_priority
        data:
          option: "SBU (Solar/Battery First)"