# ============================================================================
# ADVISORY AUTOMATION — notification-only
# ============================================================================
# T24 round 3: this
# automation is
# *notification-only*.
# The grid-outage
# response (Storm
# mode, manual hold,
# etc.) is the
# coordinator's
# responsibility.
# Auto-switching the
# HEMS user mode
# here would race
# the coordinator's
# own outage handling
# (manual hold,
# circuit breaker,
# etc.) and was
# explicitly removed
# in the audit
# follow-up.
#
# Two triggers are
# defined:
#   * grid_available
#     transitions
#     off → on (grid
#     RESTORED)
#   * grid_available
#     transitions
#     on → off (grid
#     OUTAGE)
#
# The variable
# ``is_outage`` is
# computed from
# ``trigger.to_state.state``:
#   * ``to_state.state == 'off'``
#     means the grid
#     just disappeared
#     (outage).
#   * ``to_state.state == 'on'``
#     means the grid
#     just came back
#     (restored).
#
# The previous
# implementation had
# the comparison
# inverted, so the
# "outage" path ran
# on grid recovery
# and the Storm
# trigger fired when
# the grid came back.
# ============================================================================

# ============================================================================
# Grid Outage Notifications
# ============================================================================

alias: "Grid Outage Alert (notification-only)"
description: |
  Send a mobile push when the grid goes down or comes back.
  Storm-mode handling is done by the coordinator — this YAML
  does NOT change any entity state.
mode: single

trigger:
  - platform: state
    entity_id: binary_sensor.garazh_smart_solar_inverter_grid_available
    from: "off"
    to: "on"
  - platform: state
    entity_id: binary_sensor.garazh_smart_solar_inverter_grid_available
    from: "on"
    to: "off"

action:
  - variables:
      # ``to_state.state == 'off'`` means the grid just disappeared.
      is_outage: "{{ trigger.to_state.state == 'off' }}"
      grid_v: "{{ states('sensor.garazh_smart_solar_inverter_grid_voltage') | float(0) }}"
      soc: "{{ states('sensor.garazh_smart_solar_inverter_battery_soc_corrected') | float(0) }}"

  # ── Grid outage ──
  - if:
      - condition: template
        value_template: "{{ is_outage }}"
    then:
      - service: notify.mobile_app_phone
        data:
          title: "⚡ Grid Outage Detected!"
          message: >
            Grid voltage dropped to {{ grid_v }}V.
            Battery SOC: {{ soc }}%.
            Inverter will run on battery.
          data:
            push:
              sound: "default"
              importance: "high"
            ttl: 0
            priority: "high"

  # ── Grid restored ──
  - if:
      - condition: template
        value_template: "{{ not is_outage }}"
    then:
      - service: notify.mobile_app_phone
        data:
          title: "🔌 Grid Restored"
          message: >
            Grid voltage back to {{ grid_v }}V.
            Battery SOC: {{ soc }}%.
          data:
            push:
              sound: "default"